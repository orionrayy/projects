name: DQ native client-function probe v64

on:
  push:
    paths:
      - "DQ-Reverse-Engineering/native-client-probe-v64/**"
      - "DQ-Reverse-Engineering/docs/DQ_NATIVE_CLIENT_PROBE_V64.json"
      - "DQ-Reverse-Engineering/tools/validate_dq_native_client_probe_v64.py"
      - "DQ-Reverse-Engineering/tests/test_dq_native_client_probe_v64.py"
      - "DQ-Reverse-Engineering/docs/PROJECT_PROGRESS_CHECKPOINT_V64_2026-10-25.md"
      - ".github/workflows/dq-native-client-probe-v64.yml"
  pull_request:
    paths:
      - "DQ-Reverse-Engineering/native-client-probe-v64/**"
      - "DQ-Reverse-Engineering/docs/DQ_NATIVE_CLIENT_PROBE_V64.json"
      - "DQ-Reverse-Engineering/tools/validate_dq_native_client_probe_v64.py"
      - "DQ-Reverse-Engineering/tests/test_dq_native_client_probe_v64.py"
      - "DQ-Reverse-Engineering/docs/PROJECT_PROGRESS_CHECKPOINT_V64_2026-10-25.md"
      - ".github/workflows/dq-native-client-probe-v64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and run isolated C++ mock tests
        run: |
          set -eu
          cd DQ-Reverse-Engineering/native-client-probe-v64
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude src/bridge_core.cpp tests/test_probe_core.cpp -o /tmp/dq_probe_test
          /tmp/dq_probe_test
      - name: Syntax-check the JNI shim without building an APK
        run: |
          set -eu
          cd DQ-Reverse-Engineering/native-client-probe-v64
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Iinclude -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" src/jni_bridge.cpp
      - name: Validate source-only boundary manifest
        run: python DQ-Reverse-Engineering/tools/validate_dq_native_client_probe_v64.py DQ-Reverse-Engineering/docs/DQ_NATIVE_CLIENT_PROBE_V64.json
      - name: Test fail-closed source and runtime boundaries
        run: |
          cd DQ-Reverse-Engineering
          python -m unittest discover -s tests -p 'test_dq_native_client_probe_v64.py' -v

name: Motion Studio Foundation v0.2.1
on:
  push:
    branches: ["feature/motion-studio-foundation-v0-1", "main"]
    paths:
      - "ffmpeg-motion-studio/foundation-v0-1/**"
      - ".github/workflows/motion-studio-foundation.yml"
  pull_request:
    paths:
      - "ffmpeg-motion-studio/foundation-v0-1/**"
      - ".github/workflows/motion-studio-foundation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-studio-foundation
  cancel-in-progress: true
jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ffmpeg-motion-studio/foundation-v0-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and schema validator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          python -m pip install -r requirements-test.txt
      - name: Verify toolchain
        run: |
          node --version
          ffmpeg -version | head -n 2
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          ffprobe -version | head -n 1
      - name: Validate scene manifest
        run: npm run validate:scene
      - name: Preview syntax and HTTP smoke tests
        run: |
          node --check preview-server.mjs
          node --check preview/app.mjs
          PORT=4173 npm run preview > /tmp/motion-studio-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/preview/ -o /tmp/motion-studio-preview.html; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -q "Deterministic gesture lab" /tmp/motion-studio-preview.html
          grep -q "Live parameters" /tmp/motion-studio-preview.html
          grep -q "Store A reference" /tmp/motion-studio-preview.html
          curl -fsS http://127.0.0.1:4173/src/motion-core.mjs | grep -q "evaluateFrame"
          curl -fsS http://127.0.0.1:4173/benchmarks/motion-scenarios.json | python -c 'import json,sys; x=json.load(sys.stdin); assert len(x["cases"]) == 7; print("BENCHMARK_SUITE_HTTP_PASS", len(x["cases"]))'
          curl -fsS http://127.0.0.1:4173/scenes/scene-001.json | python -c 'import json,sys; x=json.load(sys.stdin); assert x["duration_frames"] == 96 and x["fps"] == 24; print("PREVIEW_HTTP_PASS", x["scene_id"])'
      - name: Motion and layout regression tests
        run: npm test
      - name: Synthetic motion benchmark
        run: npm run benchmark:motion
      - name: Rasterizer MAE diagnostic (uncalibrated)
        run: npm run measure:raster-parity
      - name: Schema regression tests
        run: python -m unittest discover -s tests -p '*test.py' -v
      - name: Render SVG frames and verify real FFmpeg export
        run: npm run render
      - name: Upload silent pilot
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-foundation-v0-2-1-pilot-benchmarks-and-raster-diagnostics
          path: |
            ffmpeg-motion-studio/foundation-v0-1/out/foundation-scene-001.mp4
            ffmpeg-motion-studio/foundation-v0-1/out/foundation-scene-001.mp4.report.json
            ffmpeg-motion-studio/foundation-v0-1/out/motion-benchmark-report.json
            ffmpeg-motion-studio/foundation-v0-1/out/raster-parity-report.json
            ffmpeg-motion-studio/foundation-v0-1/out/raster-parity-evidence/**
          if-no-files-found: error
          retention-days: 14
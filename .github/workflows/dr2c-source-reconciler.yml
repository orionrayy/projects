name: DR2C Source Reconciler

on:
  push:
    branches:
      - main
      - dr2c-v245-static-repair-audit
    paths:
      - "DR2C-RAYY/tools/**"
      - "DR2C-RAYY/tests/**"
      - "DR2C-RAYY/audit/source_reconciliation_v2.52.json"
      - "DR2C-RAYY/audit/source_reconciliation_v2.53.json"
      - "DR2C-RAYY/audit/reproducible_source_patch_v2.55_summary.json"
      - "DR2C-RAYY/audit/start_route_static_contract_v2.56.json"
      - "DR2C-RAYY/audit/apk_candidate_v2.57_summary.json"
      - "DR2C-RAYY/audit/apk_candidate_v2.58_summary.json"
      - "DR2C-RAYY/audit/next_wave_localization_v2.58.json"
      - "DR2C-RAYY/audit/batch_k_provenance_v2.54.json"
      - "DR2C-RAYY/audit/apk_source_sync_v2.61.json"
      - "DR2C-RAYY/audit/apk_change_surface_v2.62.json"
      - "DR2C-RAYY/docs/APK_SOURCE_SYNC_AUDIT_v2.61.md"
      - "DR2C-RAYY/docs/APK_CHANGE_SURFACE_AUDIT_v2.62.md"
      - "DR2C-RAYY/docs/SOURCE_RECONCILIATION_GATE_v2.53.md"
      - "DR2C-RAYY/docs/REPRODUCIBLE_SOURCE_PATCH_v2.55.md"
      - "DR2C-RAYY/docs/START_ROUTE_STATIC_AUDIT_v2.56.md"
      - "DR2C-RAYY/docs/APK_CANDIDATE_BUILD_v2.57.md"
      - "DR2C-RAYY/docs/APK_CANDIDATE_BUILD_v2.58.md"
      - "DR2C-RAYY/docs/BATCH_K_PROVENANCE_RECONCILIATION_v2.54.md"
      - "DR2C-RAYY/README.md"
      - "DR2C-RAYY/CHANGELOG.md"
      - "DR2C-RAYY/PROJECT_MEMORY.md"
      - ".github/workflows/dr2c-source-reconciler.yml"
  pull_request:
    paths:
      - "DR2C-RAYY/tools/**"
      - "DR2C-RAYY/tests/**"
      - "DR2C-RAYY/audit/source_reconciliation_v2.52.json"
      - "DR2C-RAYY/audit/source_reconciliation_v2.53.json"
      - "DR2C-RAYY/audit/reproducible_source_patch_v2.55_summary.json"
      - "DR2C-RAYY/audit/start_route_static_contract_v2.56.json"
      - "DR2C-RAYY/audit/apk_candidate_v2.57_summary.json"
      - "DR2C-RAYY/audit/apk_candidate_v2.58_summary.json"
      - "DR2C-RAYY/audit/next_wave_localization_v2.58.json"
      - "DR2C-RAYY/audit/batch_k_provenance_v2.54.json"
      - "DR2C-RAYY/audit/apk_source_sync_v2.61.json"
      - "DR2C-RAYY/audit/apk_change_surface_v2.62.json"
      - "DR2C-RAYY/docs/APK_SOURCE_SYNC_AUDIT_v2.61.md"
      - "DR2C-RAYY/docs/APK_CHANGE_SURFACE_AUDIT_v2.62.md"
      - "DR2C-RAYY/docs/SOURCE_RECONCILIATION_GATE_v2.53.md"
      - "DR2C-RAYY/docs/REPRODUCIBLE_SOURCE_PATCH_v2.55.md"
      - "DR2C-RAYY/docs/START_ROUTE_STATIC_AUDIT_v2.56.md"
      - "DR2C-RAYY/docs/APK_CANDIDATE_BUILD_v2.57.md"
      - "DR2C-RAYY/docs/APK_CANDIDATE_BUILD_v2.58.md"
      - "DR2C-RAYY/docs/BATCH_K_PROVENANCE_RECONCILIATION_v2.54.md"
      - "DR2C-RAYY/README.md"
      - "DR2C-RAYY/CHANGELOG.md"
      - "DR2C-RAYY/PROJECT_MEMORY.md"
      - ".github/workflows/dr2c-source-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr2c-source-reconciler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reconciler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source reconciler
        run: python -m py_compile DR2C-RAYY/tools/reconcile_overlay.py DR2C-RAYY/tools/audit_overlay_provenance.py DR2C-RAYY/tools/audit_start_route.py DR2C-RAYY/tools/audit_apk_start_path.py DR2C-RAYY/tools/audit_apk_source_sync.py DR2C-RAYY/tools/audit_apk_change_surface.py

      - name: Run source reconciler unit tests
        run: python -m unittest discover -s DR2C-RAYY/tests -p "test_*.py" -v

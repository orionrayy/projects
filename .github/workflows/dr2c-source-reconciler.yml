name: DR2C Source Reconciler

on:
  push:
    branches:
      - main
      - dr2c-v245-static-repair-audit
    paths:
      - "DR2C-RAYY/tools/**"
      - "DR2C-RAYY/tests/**"
      - "DR2C-RAYY/audit/source_reconciliation_v2.52.json"
      - "DR2C-RAYY/audit/source_reconciliation_v2.53.json"
      - "DR2C-RAYY/audit/batch_k_provenance_v2.54.json"
      - "DR2C-RAYY/docs/SOURCE_RECONCILIATION_GATE_v2.53.md"
      - "DR2C-RAYY/docs/BATCH_K_PROVENANCE_RECONCILIATION_v2.54.md"
      - "DR2C-RAYY/README.md"
      - "DR2C-RAYY/CHANGELOG.md"
      - "DR2C-RAYY/PROJECT_MEMORY.md"
      - ".github/workflows/dr2c-source-reconciler.yml"
  pull_request:
    paths:
      - "DR2C-RAYY/tools/**"
      - "DR2C-RAYY/tests/**"
      - "DR2C-RAYY/audit/source_reconciliation_v2.52.json"
      - "DR2C-RAYY/audit/source_reconciliation_v2.53.json"
      - "DR2C-RAYY/audit/batch_k_provenance_v2.54.json"
      - "DR2C-RAYY/docs/SOURCE_RECONCILIATION_GATE_v2.53.md"
      - "DR2C-RAYY/docs/BATCH_K_PROVENANCE_RECONCILIATION_v2.54.md"
      - "DR2C-RAYY/README.md"
      - "DR2C-RAYY/CHANGELOG.md"
      - "DR2C-RAYY/PROJECT_MEMORY.md"
      - ".github/workflows/dr2c-source-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr2c-source-reconciler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reconciler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source reconciler
        run: python -m py_compile DR2C-RAYY/tools/reconcile_overlay.py DR2C-RAYY/tools/audit_overlay_provenance.py

      - name: Run source reconciler unit tests
        run: python -m unittest discover -s DR2C-RAYY/tests -p "test_*.py" -v

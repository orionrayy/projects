name: Motion Studio Character Quality v0.8.0
on:
  push:
    branches:
      - motion-studio-v0.8.0-character-quality
    paths:
      - ".github/workflows/motion-studio-character-quality-v0.8.0.yml"
      - "ffmpeg-motion-studio/foundation-v0.8.0/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-locomotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffmpeg-motion-studio/foundation-v0.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-studio-v0.8.0-character-quality
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check src/locomotion.mjs
      - name: Run focused locomotion regression suite
        run: npm test

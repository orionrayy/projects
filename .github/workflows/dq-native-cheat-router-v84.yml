name: DQ native cheat route gate v84

on:
  push:
    paths:
      - "DQ-Reverse-Engineering/native-client-probe-v64/**"
      - "DQ-Reverse-Engineering/cheats-sandbox/first50_flexible_cheats_v81.json"
      - "DQ-Reverse-Engineering/tools/validate_native_cheat_router_v84.py"
      - "DQ-Reverse-Engineering/docs/NATIVE_CHEAT_ROUTE_GATE_V84.md"
      - ".github/workflows/dq-native-cheat-router-v84.yml"
  pull_request:
    paths:
      - "DQ-Reverse-Engineering/native-client-probe-v64/**"
      - "DQ-Reverse-Engineering/cheats-sandbox/first50_flexible_cheats_v81.json"
      - "DQ-Reverse-Engineering/tools/validate_native_cheat_router_v84.py"
      - "DQ-Reverse-Engineering/docs/NATIVE_CHEAT_ROUTE_GATE_V84.md"
      - ".github/workflows/dq-native-cheat-router-v84.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-native-route-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run route-gate contract tests
        run: |
          set -eu
          cd DQ-Reverse-Engineering/native-client-probe-v64
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            src/native_cheat_router_v84.cpp tests/test_native_cheat_router_v84.cpp \
            -o /tmp/dq_native_route_gate_v84
          /tmp/dq_native_route_gate_v84
      - name: Compile and run the baseline ABI probe regression tests
        run: |
          set -eu
          cd DQ-Reverse-Engineering/native-client-probe-v64
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            src/bridge_core.cpp tests/test_probe_core.cpp -o /tmp/dq_probe_test
          /tmp/dq_probe_test
      - name: Syntax-check Android JNI source
        run: |
          set -eu
          cd DQ-Reverse-Engineering/native-client-probe-v64
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -Iinclude -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" src/jni_bridge.cpp
      - name: Compare native route table to canonical 50-ID registry
        run: |
          python DQ-Reverse-Engineering/tools/validate_native_cheat_router_v84.py \
            DQ-Reverse-Engineering/cheats-sandbox/first50_flexible_cheats_v81.json \
            DQ-Reverse-Engineering/native-client-probe-v64/src/native_cheat_router_v84.cpp
      - name: Ensure legacy probe boundary tests still pass
        run: |
          cd DQ-Reverse-Engineering
          python -m unittest discover -s tests -p 'test_dq_native_client_probe_v64.py' -v

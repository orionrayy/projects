name: Sugarnymous Cloudflare migration

on:
  push:
    branches: [main, sugarnymous-cloudflare-runtime-snapshot]
    paths:
      - "sugarnymous-cloudflare/**"
      - ".github/workflows/sugarnymous-cloudflare-verify.yml"
  pull_request:
    paths:
      - "sugarnymous-cloudflare/**"
      - ".github/workflows/sugarnymous-cloudflare-verify.yml"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy the native bot/API Worker to production"
        required: true
        type: boolean
        default: false
      deploy_static_site:
        description: "Deploy the static landing/privacy site Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble and hash-verify runtime snapshot
        run: node sugarnymous-cloudflare/scripts/assemble-cloudflare-snapshot.mjs
      - name: Validate snapshot syntax
        run: |
          node --check sugarnymous-cloudflare/runtime-snapshot/worker.mjs
          node --check sugarnymous-cloudflare/runtime-snapshot/telegramBundle.mjs
      - name: Validate independent static site staging
        run: |
          node --check sugarnymous-cloudflare/static-site/worker.mjs
          node <<'NODE'
          const fs = require("node:fs");
          const site = fs.readFileSync("sugarnymous-cloudflare/static-site/worker.mjs", "utf8");
          const required = ["/privacy", "/community-principles", "t.me/sugarnymousbot", "Adults 18+", "consent", "originProxy:false"];
          for (const token of required) if (!site.includes(token)) throw new Error("Static site contract missing: " + token);
          if (/floot\.app/i.test(site)) throw new Error("Static site must not depend on the Floot origin");
          if (!site.includes('Content-Security-Policy') || !site.includes('X-Content-Type-Options')) throw new Error("Required security headers missing");
          console.log("Independent static site contract passed.");
          NODE
      - name: Verify migration gate, binding, route safety, and credential hygiene
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const entry = fs.readFileSync("sugarnymous-cloudflare/runtime-snapshot/worker.mjs", "utf8");
          const bundle = fs.readFileSync("sugarnymous-cloudflare/runtime-snapshot/telegramBundle.mjs", "utf8");
          const config = fs.readFileSync("sugarnymous-cloudflare/wrangler.toml", "utf8");
          const gate = fs.readFileSync("sugarnymous-cloudflare/PRODUCTION_DEPLOY_ALLOWED", "utf8").trim();
          const forbidden = [
            /\d{8,10}:[A-Za-z0-9_-]{30,}/,
            /postgres(?:ql)?:\/\/[^\s"'\x60]+/,
            /sk-proj-[A-Za-z0-9_-]{20,}/,
            /gh[pousr]_[A-Za-z0-9]{30,}/
          ];
          if (!entry.includes("/_api/telegram-webhook")) throw new Error("Webhook route missing from snapshot");
          if (entry.includes("sugarnymous-prerelease.floot.app") || entry.includes("floot-origin-proxy")) throw new Error("Floot origin proxy must be absent from the native Worker");
          if (!entry.includes("env.STATIC_SITE.fetch")) throw new Error("Static site service binding route missing");
          if (!entry.includes('website: "cloudflare-static-service"')) throw new Error("Health contract does not identify the native static site");
          if (!config.includes('binding = "HYPERDRIVE"')) throw new Error("Hyperdrive binding missing");
          if (!config.includes('binding = "STATIC_SITE"')) throw new Error("Static site service binding missing");
          if (gate !== "true") throw new Error("Production deployment gate is not enabled after migration verification");
          for (const re of forbidden) if (re.test(entry) || re.test(bundle)) throw new Error("Potential credential pattern detected");
          console.log("Snapshot contract passed; production deployment gate is enabled after health and smoke checks.");
          NODE
      - name: Verify expected tracked files
        run: |
          test -s sugarnymous-cloudflare/runtime-snapshot/worker.mjs
          test -s sugarnymous-cloudflare/wrangler.toml
          test "$(cat sugarnymous-cloudflare/PRODUCTION_DEPLOY_ALLOWED)" = "true"

  deploy_static_site:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_static_site == true
    needs: validate
    runs-on: ubuntu-latest
    environment: sugarnymous-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static site
        run: node --check sugarnymous-cloudflare/static-site/worker.mjs
      - name: Deploy static site Worker
        run: npx --yes wrangler@4 deploy --config sugarnymous-cloudflare/static-site/wrangler-production.toml --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    needs: validate
    runs-on: ubuntu-latest
    environment: sugarnymous-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble and hash-verify runtime snapshot
        run: node sugarnymous-cloudflare/scripts/assemble-cloudflare-snapshot.mjs
      - name: Enforce migration gate
        run: |
          if [ "$(cat sugarnymous-cloudflare/PRODUCTION_DEPLOY_ALLOWED)" != "true" ]; then
            echo "::error::Production deploy blocked: site assets must be migrated and smoke tests must pass first."
            exit 1
          fi
      - name: Deploy to Cloudflare without discarding existing variables
        run: npx --yes wrangler@4 deploy --config sugarnymous-cloudflare/wrangler.toml --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Motion Studio Temporal Quality v0.8.3
on:
  push:
    branches:
      - motion-studio-v0.8.2-natural-motion
    paths:
      - ".github/workflows/motion-studio-temporal-quality-v0.8.3.yml"
      - "ffmpeg-motion-studio/foundation-v0.8.3/**"
  pull_request:
    paths:
      - ".github/workflows/motion-studio-temporal-quality-v0.8.3.yml"
      - "ffmpeg-motion-studio/foundation-v0.8.3/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ffmpeg-motion-studio/foundation-v0.8.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install render-only system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Syntax check and regression tests
        run: |
          node --check src/locomotion.mjs
          node --check scripts/render-preview.mjs
          npm test
      - name: Render SVG sequences and evidence reports
        run: |
          mkdir -p artifacts
          npm run render:preview -- .working
          test -s .working/carry-metrics.json
          test -s .working/free-metrics.json
          test -s .working/render-manifest.json
      - name: Rasterize and encode preview videos
        run: |
          set -euo pipefail
          for mode in carry free; do
            for svg in .working/.working/$mode/frame-*.svg; do
              png=$(printf '%s' "$svg" | sed 's/\.svg$/.png/')
              rsvg-convert -w 1280 -h 720 "$svg" > "$png"
            done
            ffmpeg -hide_banner -loglevel error -y \
              -framerate 24 -i ".working/.working/$mode/frame-%04d.png" \
              -frames:v 192 -c:v libx264 -preset veryfast -crf 20 \
              -pix_fmt yuv420p -movflags +faststart \
              "artifacts/$mode-preview-v0.8.3.mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -i "artifacts/$mode-preview-v0.8.3.mp4" \
              -vf "fps=4,scale=320:180,tile=8x4" -frames:v 1 -update 1 \
              "artifacts/$mode-contact-sheet-4fps.png"
            for field in width height avg_frame_rate nb_frames; do
              case "$field" in
                width) expected="1280" ;;
                height) expected="720" ;;
                avg_frame_rate) expected="24/1" ;;
                nb_frames) expected="192" ;;
              esac
              actual=$(ffprobe -v error -select_streams v:0 -show_entries "stream=$field" -of csv=s=x:p=0 "artifacts/$mode-preview-v0.8.3.mp4")
              test "$actual" = "$expected"
            done
          done
          cp .working/carry-metrics.json artifacts/
          cp .working/free-metrics.json artifacts/
          cp .working/render-manifest.json artifacts/
          rm -rf .working
      - name: Upload temporal diagnostics and rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-v0.8.3-temporal-review
          path: ffmpeg-motion-studio/foundation-v0.8.3/artifacts/*
          if-no-files-found: error
          retention-days: 14

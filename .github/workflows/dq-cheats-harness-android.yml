name: Build DQ Cheats Sandbox Harness APK

on:
  push:
    branches:
      - "feat/dq-iap-debug-cheats-modkit-v7"
    paths:
      - "DQ-Reverse-Engineering/cheats-harness/app/**"
      - "DQ-Reverse-Engineering/cheats-harness/build.gradle"
      - "DQ-Reverse-Engineering/cheats-harness/gradle.properties"
      - "DQ-Reverse-Engineering/cheats-harness/settings.gradle"
      - "DQ-Reverse-Engineering/cheats-harness/ci/**"
      - "DQ-Reverse-Engineering/cheats-sandbox/debug_cheats_catalog_v39.json"
      - ".github/workflows/dq-cheats-harness-android.yml"
  pull_request:
    paths:
      - "DQ-Reverse-Engineering/cheats-harness/app/**"
      - "DQ-Reverse-Engineering/cheats-harness/build.gradle"
      - "DQ-Reverse-Engineering/cheats-harness/gradle.properties"
      - "DQ-Reverse-Engineering/cheats-harness/settings.gradle"
      - "DQ-Reverse-Engineering/cheats-harness/ci/**"
      - "DQ-Reverse-Engineering/cheats-sandbox/debug_cheats_catalog_v39.json"
      - ".github/workflows/dq-cheats-harness-android.yml"
  workflow_dispatch:

concurrency:
  group: dq-cheats-harness-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    name: Unit tests, build, and publish APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate bundled 222-entry catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          source = Path("DQ-Reverse-Engineering/cheats-sandbox/debug_cheats_catalog_v39.json")
          asset = Path("DQ-Reverse-Engineering/cheats-harness/app/src/main/assets/debug_cheats_catalog_v39.json")
          assert source.read_bytes() == asset.read_bytes(), "Android asset is stale versus canonical catalog"
          catalog = json.loads(asset.read_text(encoding="utf-8"))
          cheats, categories = catalog.get("cheats", []), catalog.get("categories", [])
          assert len(cheats) == catalog.get("count") == 222, "catalog must contain exactly 222 entries"
          assert len(categories) == 14, "catalog must contain exactly 14 categories"
          ids = [item.get("id") for item in cheats]
          assert len(set(ids)) == 222 and all(isinstance(x, str) and x for x in ids), "IDs must be non-empty and unique"
          allowed = {"toggle", "slider", "range", "select", "action"}
          assert all(item.get("control") in allowed for item in cheats), "unsupported control"
          assert all(item.get("category") in categories for item in cheats), "entry has unknown category"
          for item in cheats:
              control = item["control"]
              if control in ("slider", "range"):
                  lo, hi, step = item.get("min"), item.get("max"), item.get("step")
                  assert all(isinstance(v, (int, float)) and math.isfinite(v) for v in (lo, hi, step)), item["id"]
                  assert lo <= hi and step > 0, item["id"]
                  defaults = [item["default"]] if control == "slider" else [item["default"]["min"], item["default"]["max"]]
                  assert all(lo <= value <= hi and abs((value-lo)/step-round((value-lo)/step)) < 1e-5 for value in defaults), item["id"]
                  if control == "range": assert item["default"]["min"] <= item["default"]["max"], item["id"]
              elif control == "select":
                  assert item.get("options") and item["default"] in item["options"], item["id"]
          print("PASS: 222 unique catalog IDs, 14 categories, source/asset bytes identical, control defaults valid.")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Run JVM unit tests and assemble APK
        working-directory: DQ-Reverse-Engineering/cheats-harness
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK exists and calculate hash
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="DQ-Reverse-Engineering/cheats-harness/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
      - name: Upload build APK artifact before emulator tests
        uses: actions/upload-artifact@v4
        with:
          name: dq-cheats-sandbox-harness-debug-apk
          path: DQ-Reverse-Engineering/cheats-harness/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Add build receipt to job summary
        shell: bash
        run: |
          {
            echo "## DQ Cheats Sandbox Harness APK"
            echo "- Artifact: dq-cheats-sandbox-harness-debug-apk"
            echo "- SHA-256: ${{ steps.apk.outputs.sha256 }}"
            echo "- Size: ${{ steps.apk.outputs.size }} bytes"
            echo "- Validation: catalog integrity + JVM unit tests + assembleDebug"
            echo "- Boundary: standalone UI harness; not patched into Dungeon Quest."
            echo "- Emulator instrumentation is a separate job and does not block this APK artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  android-emulator-smoke:
    name: Android emulator instrumentation and launch smoke test
    needs: android-build
    if: needs.android-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Download build APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dq-cheats-sandbox-harness-debug-apk
          path: ${{ runner.temp }}/dq-harness-artifact
      - name: Exercise APK on Android API 28 emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: Nexus 5X
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/DQ-Reverse-Engineering/cheats-harness/ci/android_emulator_smoke.sh"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-cheats-sandbox-harness-emulator-diagnostics
          path: |
            ${{ runner.temp }}/dq-connected-tests.log
            ${{ runner.temp }}/dq-emulator-logcat.txt
            ${{ runner.temp }}/dq-harness-window.xml
          if-no-files-found: ignore
          retention-days: 14

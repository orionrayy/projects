name: Render Procedural Motion Master (reuse verified Linux runtime)

on:
  push:
    branches:
      - feature/ffmpeg-motion-studio-9.0.2-upgrade
    paths:
      - ".github/workflows/render-procedural-master.yml"
      - "ffmpeg-motion-studio/scripts/**"
      - "ffmpeg-motion-studio/production/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: procedural-motion-master-render
  cancel-in-progress: true

jobs:
  render:
    name: Render full 6m30 motion master with audio
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERIFIED_RUNTIME_RUN_ID: "39066898988"
      ARTIFACT_NAME: ffmpeg-motion-studio-9.0.2-ubuntu-24.04-x86_64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install lightweight visual and local audio dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pil python3-venv python3-pip espeak-ng fonts-dejavu-core unzip ca-certificates \
            libass9 libfreetype6 libfontconfig1 libfribidi0 libharfbuzz0b libmp3lame0 \
            libopus0 libvorbis0a libvpx9 libx264-164 libx265-199 libdav1d7 libaom3 libzimg2 zlib1g

      - name: Preflight source and storyboard tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ffmpeg-motion-studio/scripts/render_procedural_master.py \
            ffmpeg-motion-studio/scripts/test_procedural_master.py \
            ffmpeg-motion-studio/scripts/render_procedural_master_v2.py \
            ffmpeg-motion-studio/scripts/test_procedural_master_v2.py
          python3 ffmpeg-motion-studio/scripts/test_procedural_master.py
          python3 ffmpeg-motion-studio/scripts/test_procedural_master_v2.py

      - name: Download previously verified custom FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-motion-studio-9.0.2-ubuntu-24.04-x86_64
          path: ${{ runner.temp }}/runtime-artifact
          run-id: 39066898988
          github-token: ${{ github.token }}

      - name: Verify and unpack runtime
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-artifact"
          sha256sum --check ffmpeg-9.0.2-ubuntu-24.04-x86_64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          tar -xzf ffmpeg-9.0.2-ubuntu-24.04-x86_64.tar.gz -C "$RUNNER_TEMP/ffmpeg-runtime"
          "$RUNNER_TEMP/ffmpeg-runtime/bin/ffmpeg" -version
          "$RUNNER_TEMP/ffmpeg-runtime/bin/ffprobe" -version

      - name: Smoke-test ambient audio filters
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ffmpeg-runtime/bin/ffmpeg" -y -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=2" \
            -af "tremolo=f=0.7:d=0.22,volume=0.12" -t 2 -f null -
          "$RUNNER_TEMP/ffmpeg-runtime/bin/ffmpeg" -y -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=165:sample_rate=48000:duration=2" \
            -af "tremolo=f=0.55:d=0.18,volume=0.055" -t 2 -f null -
          "$RUNNER_TEMP/ffmpeg-runtime/bin/ffmpeg" -y -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=2" \
            -af "tremolo=f=0.45:d=0.15,volume=0.025" -t 2 -f null -

      - name: Prepare free-first Indonesian TTS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/ffmpeg-tts-venv"
          if ! "$RUNNER_TEMP/ffmpeg-tts-venv/bin/pip" install --disable-pip-version-check edge-tts; then
            echo "::warning::Edge TTS install failed; renderer will use and disclose local eSpeak fallback."
          fi

      - name: Render complete procedural motion master with narration and score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video-deliverables" "$RUNNER_TEMP/video-work"
          "$RUNNER_TEMP/ffmpeg-tts-venv/bin/python" \
            ffmpeg-motion-studio/scripts/render_procedural_master_v2.py \
            --ffmpeg "$RUNNER_TEMP/ffmpeg-runtime/bin/ffmpeg" \
            --ffprobe "$RUNNER_TEMP/ffmpeg-runtime/bin/ffprobe" \
            --output-dir "$RUNNER_TEMP/video-deliverables" \
            --work-dir "$RUNNER_TEMP/video-work"
          python3 -m json.tool "$RUNNER_TEMP/video-deliverables/production-manifest-v2.json"
          test -s "$RUNNER_TEMP/video-deliverables/Dari_Kasir_Interactive_Cinematic_Motion_Master_v2.mp4"
          test -s "$RUNNER_TEMP/video-deliverables/narration-id.srt"
          test -s "$RUNNER_TEMP/video-deliverables/narration-transcript-id.txt"
          test -s "$RUNNER_TEMP/video-deliverables/sound-effect-cue-sheet.json"
          test -s "$RUNNER_TEMP/video-deliverables/visual-effect-cue-sheet.md"
          test -s "$RUNNER_TEMP/video-deliverables/sound-effects-only.wav"

      - name: Upload MP4, captions, concept, and technical QC
        uses: actions/upload-artifact@v4
        with:
          name: dari-kasir-cinematic-motion-master-v2
          path: |
            ${{ runner.temp }}/video-deliverables/Dari_Kasir_Interactive_Cinematic_Motion_Master_v2.mp4
            ${{ runner.temp }}/video-deliverables/narration-id.srt
            ${{ runner.temp }}/video-deliverables/narration-transcript-id.txt
            ${{ runner.temp }}/video-deliverables/procedural-contact-sheet-v2.jpg
            ${{ runner.temp }}/video-deliverables/production-manifest-v2.json
            ${{ runner.temp }}/video-deliverables/concept-v2.md
            ${{ runner.temp }}/video-deliverables/sound-effect-cue-sheet.json
            ${{ runner.temp }}/video-deliverables/visual-effect-cue-sheet.md
            ${{ runner.temp }}/video-deliverables/sound-effects-only.wav
          if-no-files-found: error
          retention-days: 14

name: DQ DEX lifecycle smali patcher v67

on:
  push:
    paths:
      - "DQ-Reverse-Engineering/tools/patch_dex_lifecycle_smali_v67.py"
      - "DQ-Reverse-Engineering/tests/test_patch_dex_lifecycle_smali_v67.py"
      - "DQ-Reverse-Engineering/tests/prepare_dex_lifecycle_smali_fixture_v67.py"
      - "DQ-Reverse-Engineering/tests/fixtures/dex_lifecycle_hook_v67/**"
      - "DQ-Reverse-Engineering/docs/DEX_LIFECYCLE_SMALI_PATCHER_V67.md"
      - "DQ-Reverse-Engineering/docs/PROJECT_PROGRESS_CHECKPOINT_V67_2026-10-25.md"
      - ".github/workflows/dq-dex-lifecycle-smali-patcher-v67.yml"
  pull_request:
    paths:
      - "DQ-Reverse-Engineering/tools/patch_dex_lifecycle_smali_v67.py"
      - "DQ-Reverse-Engineering/tests/test_patch_dex_lifecycle_smali_v67.py"
      - "DQ-Reverse-Engineering/tests/prepare_dex_lifecycle_smali_fixture_v67.py"
      - "DQ-Reverse-Engineering/tests/fixtures/dex_lifecycle_hook_v67/**"
      - "DQ-Reverse-Engineering/docs/DEX_LIFECYCLE_SMALI_PATCHER_V67.md"
      - "DQ-Reverse-Engineering/docs/PROJECT_PROGRESS_CHECKPOINT_V67_2026-10-25.md"
      - ".github/workflows/dq-dex-lifecycle-smali-patcher-v67.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source-patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run fail-closed source-patcher tests
        run: |
          set -eu
          python -m py_compile \
            DQ-Reverse-Engineering/tools/patch_dex_lifecycle_smali_v67.py \
            DQ-Reverse-Engineering/tests/test_patch_dex_lifecycle_smali_v67.py \
            DQ-Reverse-Engineering/tests/prepare_dex_lifecycle_smali_fixture_v67.py
          cd DQ-Reverse-Engineering
          python -m unittest discover -s tests -p 'test_patch_dex_lifecycle_smali_v67.py' -v
      - name: Resolve pinned smali tool dependency classpath
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/smali-tools/lib"
          cat > "$RUNNER_TEMP/smali-tools/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.orionrayy.validation</groupId>
            <artifactId>dq-v67-smali-tools</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency>
              <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -q -f "$RUNNER_TEMP/smali-tools/pom.xml" \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy-dependencies \
            -DoutputDirectory="$RUNNER_TEMP/smali-tools/lib"
          test -s "$RUNNER_TEMP/smali-tools/lib/smali-2.5.2.jar"
          test -s "$RUNNER_TEMP/smali-tools/lib/baksmali-2.5.2.jar"
      - name: Assemble and re-disassemble synthetic overlay
        run: |
          set -eu
          python DQ-Reverse-Engineering/tests/prepare_dex_lifecycle_smali_fixture_v67.py "$RUNNER_TEMP/dq-v67-overlay"
          java -cp "$RUNNER_TEMP/smali-tools/lib/*" org.jf.smali.Main assemble \
            --api 28 -o "$RUNNER_TEMP/dq-v67-synthetic.dex" "$RUNNER_TEMP/dq-v67-overlay"
          test -s "$RUNNER_TEMP/dq-v67-synthetic.dex"
          java -cp "$RUNNER_TEMP/smali-tools/lib/*" org.jf.baksmali.Main disassemble \
            --api 28 -o "$RUNNER_TEMP/dq-v67-roundtrip" "$RUNNER_TEMP/dq-v67-synthetic.dex"
          grep -q 'tryRegisterAndRoundTrip()V' "$RUNNER_TEMP/dq-v67-roundtrip/com/shinybox/smash/S3DRenderer.smali"
          grep -q 'nativeInvokeProbe()Z' "$RUNNER_TEMP/dq-v67-roundtrip/com/shinybox/smash/DqNativeProbe.smali"
          grep -q 'tryUnregister()V' "$RUNNER_TEMP/dq-v67-roundtrip/com/shinybox/smash/S3DRenderer.smali"
          echo 'PASS: synthetic smali overlay assembled and re-disassembled; no game DEX/APK involved.'

name: Motion Studio Adaptive Reactive Gait v0.9.5
on:
  push:
    branches: [motion-studio-v0.9.5-face-activity-suite]
    paths:
      - ".github/workflows/motion-studio-face-activity-suite-v0.9.5.yml"
      - "ffmpeg-motion-studio/foundation-v0.9.5/**"
  pull_request:
    paths:
      - ".github/workflows/motion-studio-face-activity-suite-v0.9.5.yml"
      - "ffmpeg-motion-studio/foundation-v0.9.5/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ffmpeg-motion-studio/foundation-v0.9.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install render-only tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Syntax and regression tests
        run: |
          node --check src/locomotion.mjs
          node --check scripts/render-preview.mjs
          npm test
      - name: Render SVG frames and diagnostics
        run: |
          mkdir -p artifacts
          npm run render:preview -- .working
          test -s .working/carry-metrics.json
          test -s .working/free-metrics.json
          test -s .working/render-manifest.json
          npm run render:activities -- .working/activities
          test -s .working/activities/activity-manifest.json
      - name: Rasterize and encode previews
        run: |
          set -euo pipefail
          for mode in carry free; do
            for svg in .working/.working/$mode/frame-*.svg; do
              png=$(printf '%s' "$svg" | sed 's/\.svg$/.png/')
              rsvg-convert -w 1280 -h 720 "$svg" > "$png"
            done
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -i ".working/.working/$mode/frame-%04d.png" -frames:v 192 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "artifacts/$mode-preview-v0.9.5.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "artifacts/$mode-preview-v0.9.5.mp4" -vf "fps=4,scale=320:180,tile=8x4" -frames:v 1 -update 1 "artifacts/$mode-contact-sheet-4fps.png"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "artifacts/$mode-preview-v0.9.5.mp4")" = "1280"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 "artifacts/$mode-preview-v0.9.5.mp4")" = "720"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=s=x:p=0 "artifacts/$mode-preview-v0.9.5.mp4")" = "24/1"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=s=x:p=0 "artifacts/$mode-preview-v0.9.5.mp4")" = "192"
            sha256sum "artifacts/$mode-preview-v0.9.5.mp4" >> artifacts/SHA256SUMS
          done
          # Multi-activity action proof. These are procedural 2D clips, not mocap claims.
          for activity in stand look-around reach pick-up sit-to-stand turn-in-place; do
            for svg in ".working/activities/$activity"/frame-*.svg; do
              png=$(printf '%s' "$svg" | sed 's/\.svg$/.png/')
              rsvg-convert -w 1280 -h 720 "$svg" > "$png"
            done
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -i ".working/activities/$activity/frame-%04d.png" -frames:v 72 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "artifacts/activity-$activity-v0.9.5.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "artifacts/activity-$activity-v0.9.5.mp4" -vf "fps=4,scale=320:180,tile=4x3" -frames:v 1 -update 1 "artifacts/activity-$activity-contact-sheet.png"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "artifacts/activity-$activity-v0.9.5.mp4")" = "1280"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 "artifacts/activity-$activity-v0.9.5.mp4")" = "720"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=s=x:p=0 "artifacts/activity-$activity-v0.9.5.mp4")" = "24/1"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=s=x:p=0 "artifacts/activity-$activity-v0.9.5.mp4")" = "72"
            sha256sum "artifacts/activity-$activity-v0.9.5.mp4" >> artifacts/SHA256SUMS
          done
          cp .working/activities/activity-manifest.json artifacts/
          # Reference-derived visual grammar proof: vertical 9:16 layout, restrained
          # kinetic type, stable safe zones, monochrome line art, red warning accent.
          node scripts/render-reference-visual-preview.mjs .working/reference-visual
          for svg in .working/reference-visual/frame-*.svg; do
            png=$(printf '%s' "$svg" | sed 's/\.svg$/.png/')
            rsvg-convert -w 720 -h 1280 "$svg" > "$png"
          done
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i ".working/reference-visual/frame-%04d.png" -frames:v 300 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "artifacts/reference-visual-style-preview.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "artifacts/reference-visual-style-preview.mp4" -vf "fps=2,scale=180:320,tile=4x5" -frames:v 1 -update 1 "artifacts/reference-visual-contact-sheet.png"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 "artifacts/reference-visual-style-preview.mp4")" = "720"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 "artifacts/reference-visual-style-preview.mp4")" = "1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=s=x:p=0 "artifacts/reference-visual-style-preview.mp4")" = "30/1"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=s=x:p=0 "artifacts/reference-visual-style-preview.mp4")" = "300"
          sha256sum "artifacts/reference-visual-style-preview.mp4" >> artifacts/SHA256SUMS
          cp .working/carry-metrics.json .working/free-metrics.json .working/render-manifest.json artifacts/
          rm -rf .working
      - name: Upload preview videos and evidence
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-v0.9.5-gait-and-reference-visual-review
          path: ffmpeg-motion-studio/foundation-v0.9.5/artifacts/*
          if-no-files-found: error
          retention-days: 14

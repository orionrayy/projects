name: DQ Cheats Sandbox v23 HUD schema validation

on:
  push:
    paths:
      - "DQ-Reverse-Engineering/tools/patch_pause_cheats_sandbox_v23.py"
      - "DQ-Reverse-Engineering/tests/test_pause_cheats_asset_patch_v23.py"
      - ".github/workflows/dq-cheats-sandbox-v23.yml"
  pull_request:
    paths:
      - "DQ-Reverse-Engineering/tools/patch_pause_cheats_sandbox_v23.py"
      - "DQ-Reverse-Engineering/tests/test_pause_cheats_asset_patch_v23.py"
      - ".github/workflows/dq-cheats-sandbox-v23.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile patcher and tests
        run: python -m py_compile DQ-Reverse-Engineering/tools/patch_pause_cheats_sandbox_v23.py DQ-Reverse-Engineering/tests/test_pause_cheats_asset_patch_v23.py
      - name: Run schema-preservation tests
        run: python -m unittest discover -s DQ-Reverse-Engineering/tests -p "test_pause_cheats_asset_patch_v23.py" -v

name: DQ reverse-engineering static validation

on:
  push:
    paths:
      - "DQ-Reverse-Engineering/**"
      - ".github/workflows/dq-reverse-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile Python helpers
        run: python -m py_compile DQ-Reverse-Engineering/tools/*.py DQ-Reverse-Engineering/tests/*.py
      - name: Run synthetic STK parser safety tests
        run: python DQ-Reverse-Engineering/tests/test_stk_unpacker.py
      - name: Run synthetic HUD parser safety tests
        run: python DQ-Reverse-Engineering/tests/test_hud_asset_probe.py
      - name: Run v41 synthetic HUD element record tests
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/hud_elements_probe_v41.py tests/test_hud_elements_probe_v41.py
          python -m unittest discover -s tests -p 'test_hud_elements_probe_v41.py' -v
      - name: Run v41 canonical HUD serializer regressions
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/hud_elements_serializer_v41.py tests/test_hud_elements_serializer_v41.py
          python -m unittest discover -s tests -p 'test_hud_elements_serializer_v41.py' -v
      - name: Run v43 read-only AIM model probe tests
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/aim_model_probe_v43.py tests/test_aim_model_probe_v43.py
          python -m unittest discover -s tests -p 'test_aim_model_probe_v43.py' -v
      - name: Run v42 field-preserving HUD codec tests
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/hud_elements_codec_v42.py tests/test_hud_elements_codec_v42.py
          python -m unittest discover -s tests -p 'test_hud_elements_codec_v42.py' -v
      - name: Run STK packer and cosmetic patch regression tests
        run: |
          python DQ-Reverse-Engineering/tests/test_stk_packer.py
          python DQ-Reverse-Engineering/tests/test_cosmetic_patch.py
          python DQ-Reverse-Engineering/tests/test_iap_sku_reconciliation.py
      - name: Validate v13 IAP runtime evidence and run focused tests
        run: |
          cd DQ-Reverse-Engineering
          python tools/validate_iap_runtime_evidence_v13.py
          python -m unittest discover -s tests -p 'test_iap_runtime_evidence_v13.py' -v
      - name: Run v14 AIM/HUD symbol-audit regression tests
        run: |
          cd DQ-Reverse-Engineering
          python -m unittest discover -s tests -p 'test_aim_hud_symbols.py' -v
      - name: Validate v16 Pause -> Options -> Cheats route contract
        run: |
          cd DQ-Reverse-Engineering
          python tools/validate_pause_options_cheats_route_v16.py
          python -m unittest discover -s tests -p 'test_pause_options_cheats_route_v16.py' -v
      - name: Compile and run Pause -> Options route bridge self-tests
        run: |
          set -eu
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          javac -d "$TMP_DIR"             DQ-Reverse-Engineering/runtime-adapter/src/main/java/dev/dqdebug/runtime/PauseOptionsCheatsBridge.java             DQ-Reverse-Engineering/runtime-adapter/src/test/java/dev/dqdebug/runtime/PauseOptionsCheatsBridgeSelfTest.java
          java -cp "$TMP_DIR" dev.dqdebug.runtime.PauseOptionsCheatsBridgeSelfTest
      - name: Validate v15 canonical native IAP mapping
        run: |
          cd DQ-Reverse-Engineering
          python tools/validate_iap_canonical_mapping_v15.py
          python -m unittest discover -s tests -p 'test_iap_canonical_mapping_v15.py' -v
      - name: Run v15 XML/SKU/earnability reconciliation tests
        run: |
          cd DQ-Reverse-Engineering
          python -m unittest discover -s tests -p 'test_iap_asset_reconciliation_v15.py' -v
      - name: Validate manifest, source boundaries, and secret exclusion
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("DQ-Reverse-Engineering")
          manifest = root / "manifest" / "AndroidManifest.analysis-excerpt.xml"
          node = ET.parse(manifest).getroot()
          assert node.attrib["package"] == "com.shinybox.smash"
          assert node.attrib["{http://schemas.android.com/apk/res/android}requiredSplitTypes"] == "base__abi,base__density"
          app = node.find("application")
          assert app is not None and app.attrib["{http://schemas.android.com/apk/res/android}isSplitRequired"] == "true"
          verified = list((root / "reconstruction" / "verified" / "java").rglob("*.java"))
          assert len(verified) == 3, len(verified)
          forbidden = [p for p in root.rglob("*") if p.is_file() and (p.name == "api_key.txt" or p.suffix.lower() in {".apk", ".xapk", ".hud", ".smf", ".so"} or p.name in {"classes.dex", "S3DMain.smf", "libS3DClient.so"})]
          assert not forbidden, forbidden
          assert (root / "reconstruction" / "fragments" / "S3DRenderer-native-boundary.java.txt").exists()
          assert (root / "tools" / "generate_java_stubs.py").exists()
          assert (root / "tools" / "stk_unpacker.py").exists()
          print("PASS: XML, split metadata, Java source count, source fragments, secret/binary exclusion")
          PY
      - name: Compile high-confidence Java reconstructions against temporary stubs
        run: |
          set -eu
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$TMP_DIR/android/content/res" "$TMP_DIR/android/app" "$TMP_DIR/q0" "$TMP_DIR/classes"
          cat > "$TMP_DIR/android/content/res/Configuration.java" <<'JAVA'
          package android.content.res;
          public class Configuration {}
          JAVA
          cat > "$TMP_DIR/android/app/Application.java" <<'JAVA'
          package android.app;
          import android.content.res.Configuration;
          public class Application {
            public void onCreate() {}
            public void onTerminate() {}
            public void onConfigurationChanged(Configuration config) {}
          }
          JAVA
          cat > "$TMP_DIR/q0/b.java" <<'JAVA'
          package q0;
          public class b extends android.app.Application { public b() { super(); } }
          JAVA
          javac -d "$TMP_DIR/classes"             "$TMP_DIR/android/content/res/Configuration.java"             "$TMP_DIR/android/app/Application.java"             "$TMP_DIR/q0/b.java"             DQ-Reverse-Engineering/reconstruction/verified/java/com/shinybox/smash/BuildConfig.java             DQ-Reverse-Engineering/reconstruction/verified/java/com/shinybox/smash/Globals.java             DQ-Reverse-Engineering/reconstruction/verified/java/com/shinybox/smash/S3DEngine.java
          echo "PASS: three high-confidence Java files compile against minimal temporary stubs"

      - name: Validate full 222-entry cheat catalog and implementation matrix
        run: |
          cd DQ-Reverse-Engineering
          python tools/validate_cheat_catalog_v32.py --catalog cheats-sandbox/debug_cheats_catalog_v32.json --matrix docs/CHEAT_CATALOG_IMPLEMENTATION_MATRIX_V32.json
          python -m unittest discover -s tests -p 'test_cheat_catalog_matrix_v32.py' -v

      - name: Run v35 Set Gold HUD layout regression tests
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/patch_debug_hud_set_gold_v35.py tests/test_debug_hud_set_gold_v35.py
          python -m unittest discover -s tests -p 'test_debug_hud_set_gold_v35.py' -v

      - name: Validate v39 222-cheat scrollable workbench and matrix
        run: |
          cd DQ-Reverse-Engineering
          python -m py_compile tools/validate_cheat_workbench_v39.py tests/test_cheat_workbench_v39.py
          python tools/validate_cheat_workbench_v39.py --html cheats-sandbox/cheats_options_workbench_v39.html --catalog cheats-sandbox/debug_cheats_catalog_v39.json --matrix docs/CHEAT_CATALOG_IMPLEMENTATION_MATRIX_V39.json
          python -m unittest discover -s tests -p 'test_cheat_workbench_v39.py' -v

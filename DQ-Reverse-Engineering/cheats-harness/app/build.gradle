plugins {
    id "com.android.application"
}

android {
    namespace "dev.dqdebug.sandboxharness"
    compileSdk 35

    defaultConfig {
        applicationId "dev.dqdebug.sandboxharness"
        minSdk 23
        targetSdk 34
        versionCode 18
        versionName "0.18.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    // Use the supported AndroidX instrumentation stack; legacy android.test APIs
    // were not exposing the test assertions/instrumentation methods on API 35.
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
